[capture]
workspace = "/workspace"
auto_route = true
bell = false

[limits]
list = 50
search = 100
review_captures = 10
review_lines = 200
review_bytes = 32768

[routing.aliases]
cme = "nxc"

[routing.tools]
# Add local wrappers here. Built-in tools do not need entries.
nmapq = "recon"
scanhosts = "recon"
fullportscan = "recon"
hostscan = "recon"
dcenum = "recon"
adcredenum = "recon"
credspray = "exploitation"
rcreds = "loot"
cleanlog = "reports"
