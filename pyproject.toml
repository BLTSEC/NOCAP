[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nocap"
dynamic = ["version"]
description = "Capture tool output. No cap."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX",
]

[project.scripts]
cap = "nocap.cli:main"

[project.urls]
Homepage = "https://github.com/BLTSEC/nocap"
Repository = "https://github.com/BLTSEC/nocap"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/nocap"]

[tool.hatch.build]
exclude = [
  "/.claude",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
]

[tool.hatch.version]
path = "src/nocap/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
